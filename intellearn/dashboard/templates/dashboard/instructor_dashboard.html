{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h2 class="fw-bold">📊 Instructor Dashboard</h2>
    <p>ยินดีต้อนรับ, {{ user.username }}</p>

    <h4 class="mt-4">คอร์สของคุณ</h4>
    <ul class="list-group">
        {% for course in courses %}
            <li class="list-group-item d-flex justify-content-between">
                <span>{{ course.title }}</span>
                <a href="{% url 'course:edit_course' course.id %}" class="btn btn-sm btn-warning">✏ Edit</a>
            </li>
        {% empty %}
            <li class="list-group-item">คุณยังไม่ได้สร้างคอร์ส</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
